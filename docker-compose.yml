services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Defaults to the bundled `db` service. Set DRIFTSCOPE_DB_URL in
      # .env to point the API (and therefore Grafana) at a hosted
      # database instead — e.g. the same Neon instance the scheduled eval
      # workflow writes to, so the dashboard reflects that data.
      #
      # Deliberately NOT named DATABASE_URL: compose auto-loads .env, and
      # DATABASE_URL there is the value used by host-side tooling
      # (alembic, seed, run_monitor). That's usually a localhost URL,
      # which inside a container resolves to the container itself.
      DATABASE_URL: ${DRIFTSCOPE_DB_URL:-postgresql://drift:drift@db:5432/driftscope}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_REQUEST_TIMEOUT_SECONDS: ${GEMINI_REQUEST_TIMEOUT_SECONDS:-60}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_ENV: docker
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: driftscope
      POSTGRES_USER: drift
      POSTGRES_PASSWORD: drift
    ports:
      - "5433:5432"   # 5432 is taken by local Homebrew Postgres on this Mac
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drift -d driftscope"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  grafana-data:
