name: DriftScope Nightly Canary

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run canary
        # Ollama is not available on GitHub runners, so listing it here made
        # the job fail every night on a provider that can never work.
        run: python scripts/run_canary.py --providers gemini
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          # An unset secret expands to "", which would otherwise override
          # the sensible defaults in app/core/config.py. Config now treats
          # blank as "unset", but keep these explicit fallbacks so the
          # intent is visible here too — same pattern as docker-compose.yml.
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
